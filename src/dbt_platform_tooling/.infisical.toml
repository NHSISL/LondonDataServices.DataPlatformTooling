[extend]
useDefault = true

[[rules]]
id = "any-high-entropy-quoted-string"
description = "Long high-entropy quoted string, no keyword required"
regex = '''(?:\b(?:ref|env_var)\s*\(\s*)?['"]([A-Za-z0-9+/=_\-]{32,})['"](?:\s*\))?'''
secretGroup = 1
entropy = 3.5

[rules.allowlist]
description = "Ignore GUIDs and alphabet-only strings"
regexTarget = "match"
regexes = [
	'''(?i)^(?:(?:ref|env_var)\s*\(\s*)?['"][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}['"](?:\s*\))?$''',
	'''^(?:(?:ref|env_var)\s*\(\s*)?['"][A-Za-z_-]{32,}['"](?:\s*\))?$''',
	'''^(?:(?:ref|env_var)\s*\(\s*)?['"]AZURE_(?:NOTIFICATION_INT|STAGE)_[A-Z0-9_]*LDS(?:DEV|TEST|PREPROD|PROD)[A-Z0-9_]*[0-9]{1,3}[A-Z0-9_]*['"](?:\s*\))?$''',
	'''^(?:(?:ref|env_var)\s*\(\s*)?['"]STAGE_[0-9]{1,3}_DAY_[A-Z]+(?:_[A-Z]+)*['"](?:\s*\))?$''',
]

[[allowlists]]
description = "Ignore qualified LDS metadata column references"
regexTarget = "line"
regexes = [
	'''\b(?:[A-Za-z][A-Za-z0-9_]*\.)?LDS(?:RecordId|BusinessKey|BusinessId)\b''',
]
